services:
  postgres:
    image: postgres:16-alpine
    container_name: kazora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kazora
      POSTGRES_PASSWORD: kazora_dev_password
      POSTGRES_DB: kazora
    ports:
      - "5432:5432"
    volumes:
      - kazora_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kazora"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: kazora-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: kazora-api
    restart: unless-stopped
    environment:
      PORT: 3000
      UPLOAD_DIR: /data/uploads
      PUBLIC_URL: http://localhost:3000
      DATABASE_URL: postgres://kazora:kazora_dev_password@postgres:5432/kazora
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    volumes:
      - kazora_uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: kazora-meilisearch
    restart: unless-stopped
    profiles: ["search"]
    environment:
      MEILI_MASTER_KEY: kazora_dev_master_key
    ports:
      - "7700:7700"
    volumes:
      - kazora_meilidata:/meili_data

volumes:
  kazora_pgdata:
  kazora_meilidata:
  kazora_uploads:
